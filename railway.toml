# Railway config for mes-adresses-api (BAL API)
# See docs/RAILWAY_DEPLOYMENT.md in the repo root.

[build]
buildCommand = "yarn install --frozen-lockfile && yarn build"

[deploy]
# Env toggles:
# - SERVICE_ROLE=api|cron (default: api)
# - RUN_DB_MIGRATIONS=1 to gate startup on successful migrations
startCommand = "bash ./scripts/railway-start.sh"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
